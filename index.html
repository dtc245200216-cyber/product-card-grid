<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm - Flexbox</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; }
        h2 { text-align: center; margin: 30px 0 10px; color: #222; }
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            flex: 1 1 calc(25% - 20px);
            min-width: 220px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }
        .product-card:hover { transform: translateY(-4px); }
        .product-card h4 { margin: 0 0 12px; font-size: 18px; }
        .price { margin: 0; color: #d62828; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Danh sách sản phẩm</h2>
    <div class="product-grid">
        <div class="product-card"><h4>Sản phẩm 1</h4><p class="price">500.000 đ</p></div>
        <div class="product-card"><h4>Sản phẩm 2</h4><p class="price">750.000 đ</p></div>
        <div class="product-card"><h4>Sản phẩm 3</h4><p class="price">1.200.000 đ</p></div>
        <div class="product-card"><h4>Sản phẩm 4</h4><p class="price">320.000 đ</p></div>
    </div>
</body>
</html>
